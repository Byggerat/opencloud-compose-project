## OpenCloud nginx reverse proxy config for SWAG
##
## Place in: /config/nginx/proxy-confs/  (on SWAG container)

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name opencloud.*;

    include /config/nginx/ssl.conf;

    # https://docs.opencloud.eu/docs/admin/getting-started/container/docker-compose/external-proxy#configure-and-start-opencloud
    # Increase max upload size (required for Tus — without this, uploads over 1 MB fail)
    client_max_body_size 0;

    # Disable buffering - essential for SSE
    proxy_buffering off;
    proxy_request_buffering off;

    # Extend timeouts for long connections
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    keepalive_requests 100000;
    keepalive_timeout 5m;
    http2_max_concurrent_streams 512;

    # Prevent nginx from trying other upstreams
    proxy_next_upstream off;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        
        set $upstream_app opencloud;
        set $upstream_port 9200;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
