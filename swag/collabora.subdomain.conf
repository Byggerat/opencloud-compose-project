## Collabora Online nginx reverse proxy config for SWAG
##
## Place in: /config/nginx/proxy-confs/  (on SWAG container)

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Change 'collabora' to the subdomain part of your COLLABORA_DOMAIN
    server_name collabora.*;

    include /config/nginx/ssl.conf;

    # Allow large document uploads
    client_max_body_size 0;

    # WebSocket endpoint for real-time document editing (COOL protocol)
    location ~ ^/(cool|lool)/(.*)/ws$ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # Required for WebSocket upgrade — without these the document area stays blank
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "ALLOW-FROM https://opencloud.trojtroj.ch" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://opencloud.trojtroj.ch;" always;

        set $upstream_app  opencloud-collabora;
        set $upstream_port 9980;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Main Collabora proxy
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "ALLOW-FROM https://opencloud.trojtroj.ch" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://opencloud.trojtroj.ch;" always;

        set $upstream_app  opencloud-collabora;
        set $upstream_port 9980;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}

